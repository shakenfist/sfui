# actionlint configuration for sfui.
#
# Declares custom labels used by our self-hosted CI runners so that
# `runs-on: [self-hosted, <label>]` lines do not trigger "unknown
# label" warnings.

self-hosted-runner:
  labels:
    - static
    - vm
    - debian-12
    - debian-13
    # Ephemeral runner sizes (see shakenfist/private-ci CI_SIZES). An
    # unsized vm job defaults to xs, so jobs set one explicitly.
    - s
    - claude-code

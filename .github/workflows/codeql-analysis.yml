name: CodeQL

permissions: {}

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 17 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, static]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # The vendored Lit and morphdom bundles are upstream code:
          # scanning them produces findings nobody here can fix.
          config: |
            paths-ignore:
              - lit-core.min.js
              - morphdom-umd.js

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

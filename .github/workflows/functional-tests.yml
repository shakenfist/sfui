name: Functional tests

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    # Both lanes run on ephemeral VMs, so a pull request touching only
    # docs/ or the review-tracking state skips them. This is an ordered
    # paths: list rather than paths-ignore because one docs file is
    # exercised: tools/consistency-check.py cross-checks the Layout and
    # Vendored dependencies lists in docs/vendoring.md against
    # tools/vendor.sh and the tree, so that file is put back after
    # docs/** is excluded. A later pattern overrides an earlier one.
    # Trigger-level filtering is only safe while no ruleset makes these
    # jobs required checks: a required check that never reports blocks
    # the merge forever. Switch to a dorny/paths-filter job if that
    # changes.
    paths:
      - '**'
      - '!docs/**'
      - 'docs/vendoring.md'
      - '!REVIEWS.md'
      - '!.vscode/*.weaudit'
      - '!.vscode/*.weaudit-shas.json'
      - '!.vscode/review-scope.toml'

jobs:
  sanity_checks:
    name: "Lint and consistency checks"
    # pre-commit installs hook environments (a Go toolchain for
    # actionlint, the Biome binary), which wants a writable ephemeral
    # runner rather than the shared static pool.
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    env:
      PIP_INDEX_URL: http://192.168.1.15:3141/root/pypi/+simple/
      # Fall back to pypi so a devpi cold-cache miss (empty index on a
      # first-touch package) cannot hard-fail the job.
      PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
      PIP_TRUSTED_HOST: 192.168.1.15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pre-commit
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-lint
          . /tmp/venv-lint/bin/activate
          pip3 install pre-commit

      - name: Run all pre-commit hooks
        timeout-minutes: 10
        run: |
          . /tmp/venv-lint/bin/activate
          pre-commit run --all-files --show-diff-on-failure

  unit_tests:
    name: "Unit tests"
    # playwright install-deps needs passwordless sudo for apt, which
    # the vm runners grant and the static pool does not.
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-unit
      cancel-in-progress: true
    env:
      PIP_INDEX_URL: http://192.168.1.15:3141/root/pypi/+simple/
      # Fall back to pypi so a devpi cold-cache miss (empty index on a
      # first-touch package) cannot hard-fail the job.
      PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
      PIP_TRUSTED_HOST: 192.168.1.15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install test tools and a browser
        timeout-minutes: 10
        run: |
          python3 -mvenv /tmp/venv-test
          . /tmp/venv-test/bin/activate
          pip3 install pytest playwright
          playwright install --with-deps chromium

      - name: Run the test suite
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          pytest tests/ -v

  automated_reviewer:
    name: "Automated reviewer"
    needs: [sanity_checks, unit_tests]
    permissions:
      contents: read
      pull-requests: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
